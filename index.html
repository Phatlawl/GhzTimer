<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhzTimer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18181b">
</head>
<body>
  <main id="app">
    <h1>GhzTimer</h1>
    
    <div class="timer-wrapper">
      <svg class="progress-ring" width="220" height="220">
        <circle class="progress-ring__bg" stroke="#27272a" stroke-width="10" fill="transparent" r="95" cx="110" cy="110"/>
        <circle class="progress-ring__circle" stroke="#f97316" stroke-width="10" fill="transparent" r="95" cx="110" cy="110"/>
      </svg>
      <div class="timer-center">
        <div id="timer-display">00:00</div>
        <div id="timer-status">Prêt</div>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn">Démarrer</button>
      <button id="pause-btn">Pause</button>
      <button id="reset-btn">Réinitialiser</button>
    </div>

    <section id="wod-builder">
      <h2>Structure de la séance</h2>
      
      <form id="block-form">
        <select id="block-type">
          <option value="EMOM">EMOM</option>
          <option value="AMRAP">AMRAP</option>
          <option value="FORTIME">For Time</option>
          <option value="REST">Repos</option>
        </select>

        <div id="inputs-emom" class="type-inputs">
          <input type="number" id="emom-rounds" placeholder="Tours (ex: 10)" min="1">
          <input type="number" id="emom-duration" placeholder="Durée d'un tour (sec)" value="60" min="1">
        </div>

        <div id="inputs-amrap" class="type-inputs hidden">
          <input type="number" id="amrap-duration" placeholder="Durée totale (min)" min="1">
        </div>

        <div id="inputs-fortime" class="type-inputs hidden">
          <input type="number" id="fortime-cap" placeholder="Time Cap optionnel (min)" min="1">
        </div>

        <div id="inputs-rest" class="type-inputs hidden">
          <input type="number" id="rest-duration" placeholder="Durée repos (sec)" min="1">
        </div>

        <button type="submit" id="add-block-btn">Ajouter le bloc</button>
      </form>

      <div id="block-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
