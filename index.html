<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhzTimer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e12">
</head>
<body>
  <main id="app">
    <header>
      <h1>GhzTimer</h1>
    </header>
    
    <!-- Zone Chronomètre -->
    <div class="timer-section">
      <!-- Cercle épais Garmin style (masqué hors séance) -->
      <svg id="progress-ring-svg" class="progress-ring hidden" width="240" height="240">
        <circle class="progress-ring__bg" stroke="#1f232d" stroke-width="16" fill="transparent" r="95" cx="120" cy="120"/>
        <circle class="progress-ring__circle" stroke="#00e676" stroke-width="16" stroke-linecap="round" fill="transparent" r="95" cx="120" cy="120"/>
      </svg>
      
      <div class="timer-display-box">
        <div id="timer-display">00:00</div>
        <div id="timer-status">Prêt</div>
      </div>
    </div>

    <!-- Contrôles -->
    <div class="controls">
      <button id="start-btn" class="btn-primary">Démarrer</button>
      <button id="pause-btn" class="btn-secondary">Pause</button>
      <button id="reset-btn" class="btn-danger">Réinitialiser</button>
    </div>

    <!-- Création de séance : 4 cartes avec bouton + -->
    <section id="wod-builder">
      <h2>Ajouter un bloc</h2>
      
      <div class="cards-grid">
        <!-- Carte EMOM -->
        <div class="block-card">
          <div class="card-title">EMOM</div>
          <div class="card-inputs">
            <input type="number" id="emom-rounds" placeholder="Tours (ex : 10)" min="1">
            <input type="number" id="emom-duration" placeholder="Durée tour (sec)" value="60" min="1">
          </div>
          <button type="button" class="add-btn" id="add-emom-btn">+</button>
        </div>

        <!-- Carte AMRAP -->
        <div class="block-card">
          <div class="card-title">AMRAP</div>
          <div class="card-inputs">
            <input type="number" id="amrap-duration" placeholder="Durée (min)" min="1">
          </div>
          <button type="button" class="add-btn" id="add-amrap-btn">+</button>
        </div>

        <!-- Carte For Time -->
        <div class="block-card">
          <div class="card-title">For Time</div>
          <div class="card-inputs">
            <input type="number" id="fortime-cap" placeholder="Cap min (optionnel)" min="1">
          </div>
          <button type="button" class="add-btn" id="add-fortime-btn">+</button>
        </div>

        <!-- Carte Repos -->
        <div class="block-card">
          <div class="card-title">Repos</div>
          <div class="card-inputs">
            <input type="number" id="rest-duration" placeholder="Durée (sec)" min="1">
          </div>
          <button type="button" class="add-btn" id="add-rest-btn">+</button>
        </div>
      </div>

      <h2>Programme</h2>
      <div id="block-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
