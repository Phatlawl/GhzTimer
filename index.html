<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhzTimer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1c1c1e">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
  <main id="app">
    <!-- ÉCRAN DE CRÉATION DE SÉANCE -->
    <div id="builder-screen">
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0.5rem;">
  <img src="icon.svg" alt="GhzTimer Logo" style="width: 36px; height: 36px;">
   </div>

      <!-- Grille 2x2 des boutons d'ajout -->
      <div class="buttons-grid">
        <button type="button" class="grid-btn" data-type="FORTIME">+ For Time</button>
        <button type="button" class="grid-btn" data-type="AMRAP">+ AMRAP</button>
        <button type="button" class="grid-btn" data-type="EMOM">+ EMOM</button>
        <button type="button" class="grid-btn" data-type="REST">+ Repos</button>
      </div>

      <!-- Liste déroulante des blocs -->
      <div id="block-list" class="block-list-container"></div>

      <!-- Bouton principal Lancer -->
      <button id="launch-btn" class="launch-btn">Lancer la séance</button>
    </div>

    <!-- ÉCRAN CHRONOMÈTRE (Affiché uniquement pendant la séance) -->
    <div id="timer-screen" class="hidden">
      
      <div class="timer-section">
        <svg id="progress-ring-svg" class="progress-ring" width="240" height="240">
          <circle class="progress-ring__bg" stroke="#2c2c2e" stroke-width="16" fill="transparent" r="95" cx="120" cy="120"/>
          <circle class="progress-ring__circle" stroke="#007bff" stroke-width="16" stroke-linecap="round" fill="transparent" r="95" cx="120" cy="120"/>
        </svg>
        
        <div class="timer-display-box">
          <div id="timer-display">00:00</div>
          <div id="timer-status">Prêt</div>
        </div>
      </div>

      <div class="controls">
        <button id="pause-btn" class="ctrl-btn secondary">Pause</button>
        <button id="reset-btn" class="ctrl-btn danger">Quitter</button>
      </div>
    </div>

    <!-- MODAL DE CONFIGURATION DU BLOC -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-content">
        <h3 id="modal-title">Ajouter un bloc</h3>
        <div id="modal-inputs"></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="ctrl-btn secondary">Annuler</button>
          <button id="modal-save" class="ctrl-btn primary">Valider</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
