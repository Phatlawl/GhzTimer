<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhzTimer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

  <!-- Écran de création / Builder -->
  <div id="builder-screen" class="container">
    <header class="app-header">
      <div class="logo-container">
        <img src="icon.svg" alt="GhzTimer Logo" class="app-logo">
      </div>
    </header>

    <div class="builder-grid">
      <button class="grid-btn" data-type="FORTIME">For Time</button>
      <button class="grid-btn" data-type="AMRAP">AMRAP</button>
      <button class="grid-btn" data-type="EMOM">EMOM</button>
      <button class="grid-btn" data-type="REST">Repos</button>
    </div>

    <div id="block-list" class="block-list"></div>

    <button id="launch-btn" class="primary-btn">Lancer la séance</button>
  </div>

  <!-- Écran du Chronomètre / Timer (Plein Écran) -->
  <div id="timer-screen" class="hidden">
    <div id="timer-status">Prêt ?</div>

    <div class="timer-container">
      <svg class="progress-ring" viewBox="0 0 220 220">
        <circle
          class="progress-ring__circle-bg"
          stroke="#2c2c2e"
          stroke-width="12"
          fill="transparent"
          r="95"
          cx="110"
          cy="110"
        />
        <circle
          class="progress-ring__circle"
          stroke="#00f2fe"
          stroke-width="12"
          fill="transparent"
          r="95"
          cx="110"
          cy="110"
        />
      </svg>
      <div id="timer-display">00:10</div>
    </div>

    <div class="timer-controls">
      <button id="pause-btn" class="secondary-btn">Pause</button>
      <button id="reset-btn" class="danger-btn">Quitter</button>
    </div>
  </div>

  <!-- Fenêtre Modale d'ajout/modification -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-content">
      <h2 id="modal-title">Ajouter un bloc</h2>
      <div id="modal-inputs"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="secondary-btn">Annuler</button>
        <button id="modal-save" class="primary-btn">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
