<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhzTimer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="container">

    <!-- Vue Configuration -->
    <div id="setup-view">
      
      <div class="add-buttons">
        <button onclick="addBlock('fortime')">+ For Time</button>
        <button onclick="addBlock('amrap')">+ AMRAP</button>
        <button onclick="addBlock('emom')">+ EMOM</button>
        <button onclick="addBlock('rest')">+ Repos</button>
      </div>

      <div id="workout-list" class="workout-list">
        <!-- Les blocs s'ajouteront ici -->
      </div>

      <button id="start-workout-btn" class="primary-btn" onclick="startWorkout()" style="display:none;">Lancer la séance</button>
    </div>

    <!-- Vue Entraînement en cours -->
    <div id="active-view" style="display:none;">
      <div id="block-info" class="block-info">Type de bloc</div>
      <div id="timer-display" class="display">00:00</div>
      <div id="sub-info" class="sub-info">--</div>
      
      <div class="controls">
        <button id="pause-btn" onclick="togglePause()">Pause</button>
        <button onclick="nextBlock()">Suivant</button>
        <button onclick="resetWorkout()" class="danger-btn">Quitter</button>
      </div>
    </div>
  </div>

  <!-- Modal pour modifier un bloc -->
  <div id="edit-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3 id="modal-title">Modifier le bloc</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button onclick="saveModalEdit()" class="primary-btn">Enregistrer</button>
        <button onclick="closeModal()">Annuler</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
